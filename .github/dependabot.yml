# Weekly dependency update PRs, opened against dev (feature → dev → main).
# Note: Dependabot *security* updates always target the default branch (main).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (e.g. Next 16, AI SDK 7) are planned migrations, not automatic bumps.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
